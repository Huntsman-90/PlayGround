<title>Сталь и руны — тактическая RPG</title>
<style>
:root{color-scheme:dark;--ink:#f4ead6;--muted:#a9a28f;--gold:#e4bd72;--gold2:#f6d99d;--panel:#1b2223;--panel2:#222b2b;--line:#3a4240;--red:#d46b58;--green:#87b68b;--blue:#8eb8cf;--shadow:0 18px 48px #0008}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#101619;color:var(--ink);font-family:ui-serif,Georgia,"Times New Roman",serif;overscroll-behavior:none}body{min-height:100dvh;background:radial-gradient(ellipse at 50% -20%,#485044 0,#202a29 34%,#101619 72%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}.app{width:min(100%,520px);margin:0 auto;min-height:100dvh;padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:10px}.sigil{width:37px;height:37px;border:1px solid #927646;border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:20px;background:linear-gradient(145deg,#394138,#171d1d);box-shadow:inset 0 0 12px #ddb86a22}.brand strong{display:block;font-size:16px;letter-spacing:.11em;text-transform:uppercase}.brand small{display:block;color:#9e9a88;font:10px/1.4 system-ui;letter-spacing:.17em;text-transform:uppercase}.top-actions{display:flex;gap:7px}.iconbtn{background:#242d2b;border:1px solid #414a43;border-radius:11px;width:38px;height:36px;color:#c9c2ad;font:16px system-ui}.iconbtn:active{transform:scale(.96)}.chapter{border:1px solid #47463b;background:linear-gradient(110deg,#2c3028,#242b29);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px #0002}.eyebrow{font:9px system-ui;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}.chapter h1{font-size:19px;margin:3px 0 0;font-weight:600}.chapter-meta{text-align:right;font:11px system-ui;color:#b1ad9c}.chapter-meta b{display:block;color:var(--gold2);font-size:15px;margin-bottom:3px}.battleline{display:flex;justify-content:space-between;align-items:center;font:10px system-ui;letter-spacing:.12em;text-transform:uppercase;color:#b5b09f;padding:0 3px}.battleline span{display:flex;align-items:center;gap:6px}.live{width:7px;height:7px;background:#d67b57;border-radius:50%;box-shadow:0 0 10px #d67b57}.board-wrap{padding:10px;background:linear-gradient(145deg,#282e2a,#1b2120);border:1px solid #495047;border-radius:16px;box-shadow:var(--shadow);position:relative}.board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:4px;width:100%;height:min(45vh,420px);aspect-ratio:auto;max-height:420px;margin:auto}.tile{border:1px solid #ffffff0b;border-radius:6px;position:relative;display:grid;place-items:center;overflow:hidden;min-width:0;background:#4b5442}.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff0a,transparent 55%,#0002);pointer-events:none}.tile.floor{background:linear-gradient(145deg,#59614b,#414a3b)}.tile.moss{background:linear-gradient(145deg,#415447,#34483e)}.tile.rough{background:linear-gradient(145deg,#665644,#504335)}.tile.water{background:linear-gradient(145deg,#3b6570,#2c4b57)}.tile.obstacle{background:linear-gradient(145deg,#615944,#474336)}.tile:after{content:attr(data-mark);position:absolute;right:4px;top:3px;font:10px system-ui;color:#ffffff38}.tile.valid{box-shadow:inset 0 0 0 2px #e6ca82aa;background-color:#77734b}.tile.target{box-shadow:inset 0 0 0 2px #d46b58;background-color:#714c3e}.tile.selected-tile{outline:2px solid var(--gold2);outline-offset:-2px}.tile.blocked{opacity:.52}.unit{position:relative;z-index:1;width:84%;height:88%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:7px;text-shadow:0 2px 4px #000c;cursor:pointer;transition:transform .15s,filter .15s}.unit.hero{background:radial-gradient(ellipse,#657251aa,#27362eaa 70%);border:1px solid #c9b87666}.unit.enemy{background:radial-gradient(ellipse,#754b42bb,#392c29aa 70%);border:1px solid #cd796b66}.unit.active{filter:brightness(1.35);box-shadow:0 0 0 2px #f4d28d,0 0 15px #f3cf7755}.unit.acted{filter:grayscale(.55) brightness(.77)}.unit .avatar{font-size:clamp(22px,7vw,34px);line-height:1}.unit .unit-name{font:8px system-ui;letter-spacing:.04em;color:#fff4db;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hpbar{width:76%;height:4px;border-radius:9px;background:#201c1a;overflow:hidden}.hpbar i{display:block;height:100%;background:#8cba7a;transition:width .25s}.enemy .hpbar i{background:#d07862}.unit .rank{position:absolute;top:2px;left:3px;color:#f1d691;font:8px system-ui}.unit .shield{position:absolute;top:1px;right:3px;font:10px system-ui}.board-note{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#131918dd;border:1px solid #65614b;border-radius:20px;padding:5px 11px;font:10px system-ui;color:#e3d8bf;pointer-events:none;opacity:0;transition:opacity .2s}.board-note.show{opacity:1}.party{background:linear-gradient(150deg,#242b29,#1b2221);border:1px solid #3c4540;border-radius:14px;padding:10px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.section-title strong{font-size:13px;font-weight:600}.section-title span{font:10px system-ui;color:#a49d89}.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.hero-card{border:1px solid #414a40;border-radius:10px;padding:7px 8px;background:#2c342e;min-width:0;cursor:pointer}.hero-card.chosen{border-color:#d6b66f;box-shadow:inset 0 0 0 1px #d6b66f55}.hero-card.down{opacity:.45;filter:grayscale(1)}.hero-head{display:flex;align-items:center;gap:6px}.hero-head .face{font-size:21px}.hero-head strong{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero-card small{display:block;color:#aaa58f;font:9px system-ui;margin:1px 0 5px 27px}.hero-stats{display:flex;justify-content:space-between;color:#c9c2ae;font:9px system-ui}.tinybar{height:3px;background:#131917;border-radius:3px;margin-top:5px;overflow:hidden}.tinybar i{height:100%;display:block;background:#8fb57c}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.action{min-height:54px;border:1px solid #414941;background:linear-gradient(150deg,#29322e,#202725);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#e7dfca;transition:.15s}.action .ico{font-size:17px;line-height:1}.action b{font:10px system-ui}.action small{font:8px system-ui;color:#aaa58f}.action.active{border-color:#e0bb70;background:linear-gradient(150deg,#4b4330,#30352d);box-shadow:0 0 14px #dfbb7133}.action:disabled{opacity:.38}.bottom{display:grid;grid-template-columns:1fr 1.55fr;gap:8px;margin-top:auto}.bottom button{height:43px;border-radius:11px;border:1px solid #50564b;background:#242c29;color:#d4ccb8;font:11px system-ui;letter-spacing:.06em}.bottom .endturn{background:linear-gradient(110deg,#887043,#a47e42);border-color:#c29e5d;color:#fff2d6;font-weight:700;box-shadow:0 5px 14px #0004}.bottom button:active,.action:active{transform:translateY(1px)}.log{display:none;position:fixed;inset:auto 12px calc(72px + env(safe-area-inset-bottom));z-index:5;max-width:496px;margin:auto;left:0;right:0;background:#111817f2;border:1px solid #63583f;border-radius:14px;padding:12px;box-shadow:var(--shadow)}.log.show{display:block}.log h3{margin:0 0 8px;color:var(--gold2);font-size:14px}.log ul{padding:0 0 0 17px;margin:0;max-height:30vh;overflow:auto;color:#c5bdab;font:11px/1.7 system-ui}.modal-backdrop{display:none;position:fixed;inset:0;background:#080b0bdd;z-index:10;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(100%,390px);background:linear-gradient(145deg,#30372f,#1c2322);border:1px solid #b39a61;border-radius:18px;padding:22px;text-align:center;box-shadow:var(--shadow)}.modal .big{font-size:46px}.modal h2{color:var(--gold2);font-size:23px;margin:6px 0}.modal p{color:#c3bdad;font:13px/1.55 system-ui}.modal button{background:#967644;border:1px solid #c6a665;border-radius:10px;padding:11px 20px;color:#fff2d6;font-weight:700;margin-top:8px}.hint{font:9px/1.4 system-ui;color:#8f9383;text-align:center;padding:0 8px}.toast{position:fixed;z-index:8;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:#d0ad68;color:#201c16;padding:8px 14px;border-radius:30px;font:11px system-ui;font-weight:700;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-height:850px){.app{padding-top:20px;gap:14px}.board{max-height:460px}.tile{border-radius:8px}.chapter{padding:14px 16px}.board-wrap{padding:12px}}
@media (max-height:720px){.app{gap:7px;padding-top:8px}.chapter{padding:8px 12px}.chapter h1{font-size:17px}.board{height:39vh;max-height:270px}.party{padding:7px}.hero-card{padding:5px 7px}.actions .action{min-height:47px}.bottom button{height:38px}.unit .avatar{font-size:22px}.unit .unit-name{font-size:7px;line-height:8px}.hpbar{height:3px}.hint{display:none}}
@media (min-width:600px){body{padding:16px 0}.app{min-height:calc(100dvh - 32px);border:1px solid #323a35;border-radius:24px;padding:18px;background:linear-gradient(160deg,#171e1d,#111716);box-shadow:0 25px 80px #0008}.board{max-height:440px}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><div class="sigil">✦</div><div><strong>Сталь и руны</strong><small>Хроники Серого предела</small></div></div><div class="top-actions"><button class="iconbtn" id="soundBtn" aria-label="Звук">♫</button><button class="iconbtn" id="logBtn" aria-label="Журнал боя">☰</button></div></header>
  <section class="chapter"><div><div class="eyebrow">Путь следопыта · вылазка <span id="battleNum">01</span></div><h1 id="chapterName">Перевал Серых сосен</h1></div><div class="chapter-meta"><b id="goldCount">◈ 24</b><span id="objective">Разбейте дозор</span></div></section>
  <div class="battleline"><span><i class="live"></i><span id="phaseText">Ваш ход</span></span><span id="turnText">Ход 1</span></div>
  <section class="board-wrap"><div class="board" id="board" aria-label="Поле боя"></div><div id="boardNote" class="board-note"></div></section>
  <section class="party"><div class="section-title"><strong>Отряд дозорных</strong><span id="partyStatus">Выберите бойца</span></div><div class="roster" id="roster"></div></section>
  <section class="actions" aria-label="Действия бойца"><button class="action" data-action="move"><span class="ico">➤</span><b>Движение</b><small>до 2 клеток</small></button><button class="action active" data-action="attack"><span class="ico">⚔</span><b>Удар</b><small>ближний бой</small></button><button class="action" data-action="skill"><span class="ico">✧</span><b>Умение</b><small id="skillLabel">особое действие</small></button><button class="action" data-action="wait"><span class="ico">◷</span><b>Защита</b><small>стойка стража</small></button></section>
  <div class="hint" id="hint">Коснитесь бойца, затем клетки или противника. Удерживайте отряд — чтобы увидеть подсказки.</div>
  <footer class="bottom"><button id="restartBtn">↻ &nbsp; Сначала</button><button class="endturn" id="endTurnBtn">Завершить ход &nbsp; →</button></footer>
</main>
<div class="log" id="logPanel"><h3>Летопись сражения</h3><ul id="logList"></ul></div><div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="big" id="modalIcon">🏆</div><h2 id="modalTitle">Победа!</h2><p id="modalText"></p><button id="modalBtn">Продолжить путь</button></div></div>
<script>
(()=>{
const W=5,H=6, SAVE='steel-and-runes-save-v1';
const heroesSeed=[{id:'bryn',name:'Брин',role:'Страж',icon:'🛡️',hp:30,max:30,atk:7,range:1,x:1,y:5,skill:'Щитовой натиск'},{id:'lyra',name:'Лира',role:'Следопыт',icon:'🏹',hp:24,max:24,atk:6,range:3,x:2,y:5,skill:'Меткий выстрел'},{id:'oren',name:'Орен',role:'Рунник',icon:'🔮',hp:21,max:21,atk:5,range:3,x:3,y:5,skill:'Искра руны'}];
let state, action='attack', selected='bryn', log=[], sound=true, busy=false;
const terrain=['floor','moss','floor','rough','floor','floor','rough','floor','moss','floor','moss','floor','obstacle','floor','rough','floor','water','floor','moss','floor','floor','floor','rough','floor','floor','moss','floor','floor','rough','moss'];
const $=s=>document.querySelector(s), board=$('#board');
function enemiesFor(stage){let base=[{id:'raider',name:'Налётчик',icon:'👺',hp:16,max:16,atk:4,range:1,x:1,y:0},{id:'wolf',name:'Сумрачный волк',icon:'🐺',hp:13,max:13,atk:4,range:1,x:3,y:1},{id:'archer',name:'Разбойник',icon:'🏹',hp:12,max:12,atk:4,range:3,x:4,y:0}];if(stage%3===0)base.push({id:'ogre',name:'Болотный громила',icon:'👹',hp:23,max:23,atk:6,range:1,x:2,y:1});return base.map((e,i)=>({...e,id:e.id+i,hp:e.hp+Math.floor((stage-1)/2)*2,max:e.max+Math.floor((stage-1)/2)*2,atk:e.atk+Math.floor((stage-1)/3)}))}
function fresh(stage=1,gold=24,carry){return {stage,gold,turn:1,phase:'hero',heroes:carry||heroesSeed.map(h=>({...h})),enemies:enemiesFor(stage),used:{},defending:{},terrain:[...terrain]}}
function load(){try{let x=JSON.parse(localStorage.getItem(SAVE));if(x&&x.heroes&&x.enemies)return x}catch(e){}return fresh()}
state=load(); selected=state.heroes.find(h=>h.hp>0)?.id||null;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
function note(msg){let n=$('#boardNote');n.textContent=msg;n.classList.add('show');clearTimeout(note.t);note.t=setTimeout(()=>n.classList.remove('show'),2100)}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1700)}
function tone(freq=360){if(!sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=tone.ctx||(tone.ctx=new C()),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.035,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.13)}catch(e){}}
function addLog(text){log.unshift(text);log=log.slice(0,20);$('#logList').innerHTML=log.map(x=>`<li>${x}</li>`).join('')}
function units(){return [...state.heroes,...state.enemies].filter(u=>u.hp>0)}
function at(x,y){return units().find(u=>u.x===x&&u.y===y)}
function selectedUnit(){return state.heroes.find(h=>h.id===selected&&h.hp>0)}
function aliveEnemies(){return state.enemies.filter(e=>e.hp>0)}
function distance(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}
function canMove(x,y,u){return x>=0&&x<W&&y>=0&&y<H&&!at(x,y)&&state.terrain[y*W+x]!=='obstacle'&&state.terrain[y*W+x]!=='water'&&Math.abs(u.x-x)+Math.abs(u.y-y)<=2}
function render(){
 $('#battleNum').textContent=String(state.stage).padStart(2,'0');$('#chapterName').textContent=['Перевал Серых сосен','Затонувшая часовня','Курган безымянных'][((state.stage-1)%3)];$('#goldCount').textContent=`◈ ${state.gold}`;$('#objective').textContent=`Разбейте дозор · ${aliveEnemies().length} враг${aliveEnemies().length===1?'':'а'}`;$('#turnText').textContent=`Ход ${state.turn}`;$('#phaseText').textContent=state.phase==='hero'?'Ваш ход':'Ход противника';$('#partyStatus').textContent=state.phase==='enemy'?'Враги действуют':selectedUnit()?`${selectedUnit().name} · ${state.used[selected]?'действовал':'готов к бою'}`:'Выберите бойца';
 $('#skillLabel').textContent=selectedUnit()?.skill||'особое действие';
 document.querySelectorAll('.action').forEach(b=>b.classList.toggle('active',b.dataset.action===action));
 board.innerHTML='';let u=selectedUnit();
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let idx=y*W+x,t=state.terrain[idx],tile=document.createElement('div');tile.className=`tile ${t}`;tile.dataset.x=x;tile.dataset.y=y;if(t==='obstacle')tile.dataset.mark='♜';if(t==='water')tile.dataset.mark='≈';
 if(u&&state.phase==='hero'&&!state.used[u.id]&&action==='move'&&canMove(x,y,u))tile.classList.add('valid');if(u&&action==='skill'&&aliveEnemies().some(e=>distance(u,e)<=u.range&&e.x===x&&e.y===y))tile.classList.add('target');
 let unit=at(x,y);if(unit){let isHero=state.heroes.includes(unit),el=document.createElement('div');el.className=`unit ${isHero?'hero':'enemy'} ${unit.id===selected?'active':''} ${state.used[unit.id]?'acted':''}`;el.dataset.id=unit.id;el.innerHTML=`${isHero&&unit.id==='bryn'?'<span class="rank">I</span>':''}<span class="avatar">${unit.icon}</span><span class="unit-name">${unit.name}</span><span class="hpbar"><i style="width:${Math.max(0,unit.hp/unit.max*100)}%"></i></span>${state.defending[unit.id]?'<span class="shield">◈</span>':''}`;tile.appendChild(el)}
 tile.addEventListener('click',()=>onTile(x,y));board.appendChild(tile)}
 $('#roster').innerHTML=state.heroes.map(h=>`<article class="hero-card ${h.id===selected?'chosen':''} ${h.hp<=0?'down':''}" data-hero="${h.id}"><div class="hero-head"><span class="face">${h.icon}</span><strong>${h.name}</strong></div><small>${h.role}</small><div class="hero-stats"><span>❤ ${Math.max(0,h.hp)}/${h.max}</span><span>⚔ ${h.atk}</span></div><div class="tinybar"><i style="width:${Math.max(0,h.hp/h.max*100)}%"></i></div></article>`).join('');
 document.querySelectorAll('.hero-card').forEach(c=>c.onclick=()=>{if(state.phase!=='hero')return;selected=c.dataset.hero;render()});$('#endTurnBtn').disabled=state.phase!=='hero';$('#endTurnBtn').style.opacity=state.phase==='hero'?'1':'.55';$('#hint').textContent=state.phase==='hero'?(action==='move'?'Подсвеченные клетки — куда можно переместиться.':'Выберите бойца и коснитесь противника в радиусе действия.'):'Противники выбирают цель и атакуют.';
}
function onTile(x,y){if(state.phase!=='hero'||busy)return;let unit=at(x,y),u=selectedUnit();if(unit&&state.heroes.includes(unit)){selected=unit.id;render();return}if(!u){note('Сначала выберите бойца отряда');return}if(state.used[u.id]){note(`${u.name} уже действовал в этом ходу`);return}if(action==='move'){if(canMove(x,y,u)){u.x=x;u.y=y;state.used[u.id]=true;addLog(`${u.name} перемещается по полю.`);action='attack';save();render();checkWin()}else note('Эта клетка недоступна');return}if(unit&&state.enemies.includes(unit)){if(action==='attack')attack(u,unit,false);else if(action==='skill')skill(u,unit);else note('Выберите действие «Удар» или «Умение»');return}if(action==='wait'){state.defending[u.id]=true;state.used[u.id]=true;addLog(`${u.name} принимает защитную стойку.`);save();render();return}if(action==='attack'||action==='skill')note('Коснитесь противника в пределах досягаемости')}
function attack(attacker,target,isEnemy){if(distance(attacker,target)>attacker.range){note('Противник слишком далеко');return}let dmg=attacker.atk+Math.floor(Math.random()*3);if(state.defending[target.id]){dmg=Math.max(1,Math.floor(dmg/2));delete state.defending[target.id]}target.hp=Math.max(0,target.hp-dmg);tone(isEnemy?220:390);addLog(`${attacker.name} наносит ${target.name} ${dmg} урона${target.hp===0?' — противник повержен':''}.`);if(!isEnemy)state.used[attacker.id]=true;save();render();if(!checkWin()&&target.hp===0)toast('Противник повержен')}
function skill(u,target){if(distance(u,target)>u.range){note('Цель вне радиуса умения');return}if(u.id==='bryn'){let dmg=u.atk+5;target.hp=Math.max(0,target.hp-dmg);u.hp=Math.min(u.max,u.hp+4);addLog(`Брин проводит щитовой натиск: ${dmg} урона и +4 здоровья.`)}else if(u.id==='lyra'){let dmg=u.atk+6;target.hp=Math.max(0,target.hp-dmg);addLog(`Лира выпускает меткий выстрел: ${dmg} урона.`)}else{let dmg=u.atk+4;target.hp=Math.max(0,target.hp-dmg);let other=aliveEnemies().filter(e=>e!==target&&distance(e,target)<=1)[0];if(other){other.hp=Math.max(0,other.hp-4);addLog(`Орен высвобождает искру руны: ${dmg} урона и цепной разряд!`)}else addLog(`Орен высвобождает искру руны: ${dmg} урона.`)}state.used[u.id]=true;action='attack';save();render();checkWin()}
function setAction(a){action=a;render();if(a==='move')note('Выберите подсвеченную клетку для перемещения');else if(a==='skill')note(selectedUnit()?.skill||'Выберите умение')}
document.querySelectorAll('.action').forEach(b=>b.onclick=()=>{if(state.phase!=='hero')return;if(!selectedUnit()){note('Выберите бойца');return}if(state.used[selected]){note('Этот боец уже действовал');return}setAction(b.dataset.action)});
function neighbors(x,y){return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&a<W&&b>=0&&b<H&&state.terrain[b*W+a]!=='obstacle'&&state.terrain[b*W+a]!=='water')}
function enemyTurn(){if(state.phase!=='hero'||busy)return;busy=true;state.phase='enemy';render();addLog('Противник идёт в атаку.');let alive=[...aliveEnemies()];let i=0;function step(){if(i>=alive.length){finishEnemyTurn();return}let e=alive[i++];if(e.hp<=0){step();return}let targets=state.heroes.filter(h=>h.hp>0);if(!targets.length){finishEnemyTurn();return}targets.sort((a,b)=>distance(e,a)-distance(e,b));let target=targets[0];if(distance(e,target)>e.range){let opts=neighbors(e.x,e.y).filter(([x,y])=>!at(x,y));opts.sort((a,b)=>(Math.abs(a[0]-target.x)+Math.abs(a[1]-target.y))-(Math.abs(b[0]-target.x)+Math.abs(b[1]-target.y)));if(opts.length){e.x=opts[0][0];e.y=opts[0][1]}}if(distance(e,target)<=e.range){attack(e,target,true)}render();setTimeout(step,470)}setTimeout(step,350)}
function finishEnemyTurn(){if(state.heroes.every(h=>h.hp<=0)){busy=false;state.phase='hero';render();showModal(false);return}state.turn++;state.phase='hero';state.used={};state.defending={};busy=false;selected=state.heroes.find(h=>h.hp>0)?.id||null;action='attack';save();render();toast('Ваш ход');}
function checkWin(){if(aliveEnemies().length===0){state.gold+=12+state.stage*2;state.heroes.forEach(h=>{if(h.hp>0)h.hp=Math.min(h.max,h.hp+5)});save();showModal(true);return true}if(state.heroes.every(h=>h.hp<=0)){showModal(false);return true}return false}
function showModal(win){$('#modalIcon').textContent=win?'🏆':'🕯️';$('#modalTitle').textContent=win?'Перевал очищен':'Отряд пал';$('#modalText').textContent=win?`Дозор разбит. Вы нашли ${12+state.stage*2} серебряных монет. Отряд перевёл дух и восстановил 5 здоровья. Дальше путь ведёт к новым опасностям.`:'Тьма сомкнулась над перевалом. Попробуйте снова — прогресс сохраняется на этом устройстве.';$('#modalBtn').textContent=win?'Продолжить путь':'Начать заново';$('#modal').classList.add('show');busy=false}
$('#modalBtn').onclick=()=>{let win=$('#modalTitle').textContent==='Перевал очищен';$('#modal').classList.remove('show');if(win){state=fresh(state.stage+1,state.gold,state.heroes);log=[];selected=state.heroes.find(h=>h.hp>0)?.id||null}else{state=fresh(1,24);log=[];selected='bryn'}save();render()};
$('#endTurnBtn').onclick=enemyTurn;$('#restartBtn').onclick=()=>{if(confirm('Начать приключение заново? Текущий бой будет сброшен.')){state=fresh(1,24);selected='bryn';action='attack';log=[];save();render();toast('Приключение началось')}};
$('#logBtn').onclick=()=>$('#logPanel').classList.toggle('show');document.addEventListener('click',e=>{if(!e.target.closest('#logPanel')&&!e.target.closest('#logBtn'))$('#logPanel').classList.remove('show')});$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').textContent=sound?'♫':'♪';toast(sound?'Звук включён':'Звук выключен')};
render();addLog('Отряд достиг перевала. Впереди замечен вражеский дозор.');
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
